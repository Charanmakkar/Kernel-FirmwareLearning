" style="fill: #ffffff"/>
    </g>
    <text style="font-size: 8.7px; font-family: 'DejaVu Sans'; fill: #26384a" transform="translate(478.918544 347.867897) rotate(-90)">diagnostic feedback only</text>
   </g>
   <g id="text_16">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #26384a" transform="translate(40.489453 539.464092)">The stop path is modeled software. Real MCU timing, motor dynamics and an independent</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #26384a" transform="translate(97.405312 550.225983)">hardware stopping circuit require separate design and validation.</text>
   </g>
