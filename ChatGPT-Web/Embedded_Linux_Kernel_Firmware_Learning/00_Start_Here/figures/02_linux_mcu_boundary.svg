   <g id="text_1">
    <text style="font-weight: 700; font-size: 15px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #182d45" x="244.8" y="33.976856" transform="rotate(-0 244.8 33.976856)">Linux and MCU responsibilities</text>
   </g>
   <g id="text_2">
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #26384a" x="244.8" y="49.704276" transform="rotate(-0 244.8 49.704276)">C02 evidence: deterministic host simulation; no physical motor outputs</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 11.2px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #182d45" x="287.10144" y="91.08561" transform="rotate(-0 287.10144 91.08561)">Linux role</text>
   </g>
   <g id="text_4">
    <text style="font-size: 10.3px; font-family: 'DejaVu Sans'; fill: #111111" transform="translate(153.705174 111.693491)">Plan motion and publish bounded wheel commands</text>
    <text style="font-size: 10.3px; font-family: 'DejaVu Sans'; fill: #111111" transform="translate(154.56619 124.401196)">Refresh commands every 50 ms in the lab scenario</text>
    <text style="font-size: 10.3px; font-family: 'DejaVu Sans'; fill: #111111" transform="translate(191.006463 137.108902)">Collect diagnostics and explain faults</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 11.2px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #182d45" x="287.10144" y="205.82481" transform="rotate(-0 287.10144 205.82481)">Protocol boundary</text>
   </g>
   <g id="text_6">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #111111" transform="translate(176.084252 222.572837)">Version, sequence, wheel setpoints and CRC</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #111111" transform="translate(177.096752 234.910415)">Reject malformed or out of range messages</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #111111" transform="translate(166.063159 247.247993)">CRC detects corruption; it does not authenticate</text>
   </g>
   <g id="text_7">
    <g id="patch_12">
     <path d="M 304.828672 176.567636 
L 382.178047 176.567636 
L 382.178047 164.977324 
L 304.828672 164.977324 
z
" style="fill: #ffffff"/>
    </g>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #26384a" x="343.50336" y="173.255918" transform="rotate(-0 343.50336 173.255918)">command frame</text>
   </g>
   <g id="text_8">
    <text style="font-weight: 700; font-size: 11.2px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #182d45" x="287.10144" y="310.88721" transform="rotate(-0 287.10144 310.88721)">MCU role</text>
   </g>
   <g id="text_9">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #111111" transform="translate(167.139721 337.416059)">Validate frame, sequence and local speed limits</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #111111" transform="translate(160.355346 349.753637)">Refresh freshness only after a valid new command</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #111111" transform="translate(166.215502 362.091215)">Expire demand at 200 ms; output becomes zero</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #111111" transform="translate(186.892065 374.428793)">Latch a local stop until deliberate rearm</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #111111" transform="translate(192.556127 386.766371)">Rearm alone does not request motion</text>
   </g>
   <g id="text_10">
    <text style="font-weight: 700; font-size: 10.3px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #182d45" x="63.84384" y="318.497751" transform="rotate(-0 63.84384 318.497751)">Local stop</text>
   </g>
   <g id="text_11">
    <text style="font-size: 9.3px; font-family: 'DejaVu Sans'; fill: #111111" transform="translate(30.487356 338.950163)">Separate from</text>
    <text style="font-size: 9.3px; font-family: 'DejaVu Sans'; fill: #111111" transform="translate(24.205496 350.424111)">Linux commands</text>
    <text style="font-size: 9.3px; font-family: 'DejaVu Sans'; fill: #111111" transform="translate(63.84384 361.898059)"/>
    <text style="font-size: 9.3px; font-family: 'DejaVu Sans'; fill: #111111" transform="translate(30.401621 373.372006)">Software latch</text>
    <text style="font-size: 9.3px; font-family: 'DejaVu Sans'; fill: #111111" transform="translate(33.685684 384.845954)">in this model</text>
   </g>
   <g id="text_12">
    <text style="font-weight: 700; font-size: 11.2px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #182d45" x="287.10144" y="454.93329" transform="rotate(-0 287.10144 454.93329)">Actuator and feedback simulation</text>
   </g>
   <g id="text_13">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #111111" transform="translate(178.704565 476.467706)">Differential drive integrated at 10 ms steps</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #111111" transform="translate(169.572534 488.805284)">Record wheel output, pose and controller state</text>
   </g>
