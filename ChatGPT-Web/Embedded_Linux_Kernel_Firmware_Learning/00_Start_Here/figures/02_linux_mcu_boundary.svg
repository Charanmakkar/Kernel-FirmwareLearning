    </g>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #26384a" x="352.90368" y="425.958638" transform="rotate(-0 352.90368 425.958638)">limited output</text>
   </g>
   <g id="text_15">
    <g id="patch_14">
     <path d="M 481.684872 348.824897 
L 481.684872 238.234303 
L 471.350904 238.234303 
L 471.350904 348.824897 
